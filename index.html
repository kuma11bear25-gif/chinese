<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中国語単語クイズ</title>
  <link rel="stylesheet" href="style.css?v=20261110a">
</head>
<body>
  <header>
    <h1>中国語単語クイズ</h1>
    <button id="homeBtn" class="link-btn hidden">← メニューへ</button>
  </header>

  <main>
    <!-- メニュー画面 -->
    <section id="menu">
      <h2>1. HSKの級を選ぶ</h2>
      <div id="levelList" class="option-grid three"></div>

      <h2>2. 出題モードを選ぶ</h2>
      <div class="option-grid" id="modeList">
        <label class="option"><input type="radio" name="mode" value="audio" checked><span>単語の聞き取り<small>単語を聞いて意味を選ぶ</small></span></label>
        <label class="option"><input type="radio" name="mode" value="phrase"><span>フレーズの聞き取り<small>2〜3語の言い回しを聞いて意味を選ぶ</small></span></label>
      </div>

      <div id="categoryBlock">
        <h2>3. 品詞を選ぶ</h2>
        <div id="categoryList" class="option-grid"></div>
      </div>

      <h2 id="countHeading">4. 問題数</h2>
      <div class="option-grid three" id="countList">
        <label class="option"><input type="radio" name="count" value="10" checked><span>10問</span></label>
        <label class="option"><input type="radio" name="count" value="20"><span>20問</span></label>
        <label class="option"><input type="radio" name="count" value="0"><span>全問</span></label>
      </div>
      <label class="check"><input type="checkbox" id="weakFirst"> 正解回数の少ない単語を優先する</label>

      <button id="startBtn" class="primary">スタート</button>

      <div class="menu-footer">
        <button id="listBtn" class="link-btn">単語一覧・正解回数を見る</button>
        <span id="totalStats"></span>
      </div>
    </section>

    <!-- クイズ画面 -->
    <section id="quiz" class="hidden">
      <div class="quiz-top">
        <span id="progress"></span>
        <span id="score"></span>
      </div>
      <div class="card">
        <div id="question" class="question"></div>
        <div id="pinyin" class="pinyin"></div>
        <button id="speakBtn" class="speak" title="音声を再生">🔊 再生</button>
        <button id="slowBtn" class="speak" title="ゆっくり再生">🐢 ゆっくり</button>
        <div id="wordStat" class="word-stat"></div>
      </div>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback"></div>
      <button id="nextBtn" class="primary hidden">次へ</button>
    </section>

    <!-- 結果画面 -->
    <section id="result" class="hidden">
      <h2>結果</h2>
      <p id="resultScore" class="result-score"></p>
      <h3>間違えた単語</h3>
      <ul id="missedList" class="word-table"></ul>
      <div class="row">
        <button id="retryBtn" class="primary">もう一度</button>
        <button id="retryMissedBtn">間違えた単語だけ</button>
      </div>
    </section>

    <!-- 単語一覧画面 -->
    <section id="list" class="hidden">
      <div class="tabs" id="listTabs"></div>
      <table class="stats-table">
        <thead><tr><th>単語</th><th>ピンイン</th><th>意味</th><th>正解</th><th>回答</th><th></th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
      <button id="resetBtn" class="danger">正解回数をリセット</button>
    </section>
  </main>

  <script src="words.js?v=20261110a"></script>
  <script src="idioms.js?v=20261110a"></script>
  <script src="phrases.js?v=20261110a"></script>
  <script src="app.js?v=20261110a"></script>
</body>
</html>
